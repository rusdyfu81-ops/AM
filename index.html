<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Direktori Toko — Lantai 3</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="top"></div>
<div class="shell">
  <section class="plan-card">
    <div class="plan-head">
      <div><div class="plan-title">Denah Lantai 3</div><div class="plan-sub">200 UNIT · 7 ZONA</div></div>
      <div class="legend">
        <span class="lg"><i style="background:#E9B429"></i>KULINER</span>
        <span class="lg"><i style="background:#2F8F82"></i>RITEL</span>
        <span class="lg"><i style="background:#7C6BD6"></i>JASA</span>
        <span class="lg"><i style="background:#1E4A50;border:1px dashed rgba(241,238,229,.35)"></i>KOSONG</span>
      </div>
    </div>
    <div class="zonebar" id="zonebar"></div>
    <div class="viewtog"><button data-pv="plan">DENAH</button><button data-pv="list">DAFTAR</button></div>
    <div class="plan" id="plan"></div>
    <div id="planList"></div>
  </section>
  <section class="panel">
    <div class="card" id="detail"></div>
    <div class="card"><div class="card-lbl" id="listlbl">SEMUA TOKO DI LANTAI INI</div><div class="results" id="results"></div></div>
    <div class="reward" id="reward"></div>
  </section>
</div>
<script src="assets/qrcode.js"></script>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
const C=cfg();
document.getElementById('top').innerHTML=topbar({search:true,
  bar:'MODE DEMO · data contoh. Halaman ini yang dibuka pengunjung setelah memindai QR di pintu masuk.'});

/* denah */
const planEl=document.getElementById('plan'),listEl=document.getElementById('planList');
renderPlan(planEl,listEl,'ALL');
zonebar(document.getElementById('zonebar'),z=>{renderPlan(planEl,listEl,z);
  toast(z==='ALL'?'Menampilkan seluruh lantai.':'Zona '+z+' — '+ZONES[z])});
document.querySelectorAll('.viewtog button').forEach(b=>b.onclick=()=>{
  const L=b.dataset.pv==='list';
  document.querySelectorAll('.viewtog button').forEach(x=>x.classList.toggle('on',x===b));
  document.getElementById('plan').style.display=L?'none':'grid';
  document.getElementById('planList').style.display=L?'flex':'none'});
document.querySelector('.viewtog button[data-pv="'+(matchMedia('(max-width:700px)').matches?'list':'plan')+'"]').click();

/* detail + daftar */
const detail=document.getElementById('detail'),results=document.getElementById('results'),listlbl=document.getElementById('listlbl');
function showDetail(code){
  const u=unit(code);if(!u)return;
  selectUnit(code);
  if(!isLive(u)){detail.innerHTML=`<div class="card-lbl">UNIT ${u.u}</div><h2 class="detail-name">Unit ini belum terisi</h2>
    <div class="chips"><span class="chip">${u.sis==='renovasi'?'Sedang direnovasi':'Tersedia untuk disewa'}</span></div>
    <p class="empty-note">Tertarik membuka usaha di sini? Hubungi tim leasing di 021-5500-3300.</p>`;return}
  const promoOn=C.fPromo&&u.promo;
  detail.innerHTML=`<div class="card-lbl">UNIT ${u.u}</div><h2 class="detail-name">${esc(u.n)}</h2>
    <div class="chips"><span class="chip">${esc(u.kat)}</span><span class="chip open">Buka sekarang</span>
    ${u.tier==='sorotan'?'<span class="chip hot">Sorotan</span>':''}</div>
    ${promoOn?`<div class="promo-line">🏷️ ${esc(u.promo)}${u.until?`<small>BERLAKU SAMPAI ${u.until}</small>`:''}</div>`:''}
    ${C.fArah?`<div class="arah"><b>CARA KE SINI</b>${arah(u)}</div>`:''}
    <dl class="kv"><dt>Lokasi</dt><dd>Lantai 3, unit <span class="mono">${u.u}</span></dd><dt>Jam buka</dt><dd>${u.jam}</dd>
    <dt>WhatsApp</dt><dd>${u.wa}</dd><dt>Di mall sejak</dt><dd>${u.sejak}</dd></dl>
    <button class="btn alt" data-hl="${u.u}">Sorot di denah</button>`;
}
function renderList(f){
  f=(f||'').trim().toLowerCase();
  const all=units().filter(u=>isLive(u)&&(!f||u.n.toLowerCase().indexOf(f)>-1||u.kat.toLowerCase().indexOf(f)>-1||
      u.u.toLowerCase().indexOf(f)>-1||(u.kws||[]).some(k=>k[0].indexOf(f)>-1)))
    .sort((a,b)=>RANK[a.tier]-RANK[b.tier]||b.views-a.views);
  const it=all.slice(0,f?60:40);
  listlbl.textContent=f?`${all.length} HASIL UNTUK “${f.toUpperCase()}”${all.length>it.length?' · 60 TERATAS':''}`
    :`${all.length} TOKO DI LANTAI INI · ${it.length} TERPOPULER`;
  if(!it.length){results.innerHTML=`<p class="empty-note">Belum ada toko yang cocok di lantai ini. Kalau Anda melihat tokonya ada di lapangan, klaim kupon lewat tab “Kasirnya tidak ada QR?” di bawah.</p>`;logZero(f);return}
  results.innerHTML=it.map(u=>`<button class="res" data-u="${u.u}"><span class="rc">${u.u}</span>
    <span><span class="rn">${esc(u.n)}</span>${u.tier==='sorotan'?'<span class="sor">SOROTAN</span>':''}<br>
    <span class="rk">${esc(u.kat)} · ${u.jam}</span>${C.fPromo&&u.promo?`<br><span class="rp">🏷️ ${esc(u.promo)}</span>`:''}</span></button>`).join('');
}
let zt;function logZero(f){if(!C.fLogNihil||f.length<3)return;clearTimeout(zt);
  zt=setTimeout(()=>{const z=zeroLog(),x=z.find(a=>a.q===f);
    if(x){x.n++;x.fresh=true}else z.push({q:f,n:1,fresh:true});saveZero(z)},700)}
document.addEventListener('click',e=>{
  const hl=e.target.closest('[data-hl]');if(hl){flashUnit(hl.dataset.hl);toast('Unit '+hl.dataset.hl+' disorot di denah.');return}
  const t=e.target.closest('[data-u]');if(t)showDetail(t.dataset.u)});
document.getElementById('q').addEventListener('input',e=>renderList(e.target.value));

/* kupon */
const R=document.getElementById('reward');
if(!C.fKupon){R.style.display='none'}else{
  const sisa=Math.max(0,C.kuponKuotaHari-C.kuponTerpakai);
  R.innerHTML=`<div class="reward-hero"><b>${rp(C.kuponNilai)}</b><span>kupon belanja, setiap transaksi</span></div>
  <p>Berlaku di seluruh tenant ${esc(C.namaMall)}. Tidak perlu memasang aplikasi.
  Menemukan toko yang belum terdaftar? Hadiahnya ${rp(C.hadiahLaporan)}.</p>
  <div class="quota" id="quota">KUOTA HARI INI: ${sisa} DARI ${C.kuponKuotaHari} · MAKS ${C.kuponPerNomor} PER NOMOR PER HARI</div>
  <div class="tabs"><button class="tab on" data-t="scan">SCAN QR DI KASIR</button><button class="tab" data-t="noqr">KASIRNYA TIDAK ADA QR?</button></div>
  <div id="tabScan">
    <div class="scanner"><div class="frame">⛶</div><p>ARAHKAN KE QR DI MEJA KASIR</p></div>
    <div id="scanOut"></div><button class="btn" id="doScan">Pindai QR</button>
  </div>
  <div id="tabNoqr" style="display:none">
    <p style="margin-bottom:11px">Toko yang belum terdaftar berhak atas hadiah lebih besar, ${rp(C.hadiahLaporan)}, dibayarkan setelah kami verifikasi. Cukup sebutkan nomor kiosnya.</p>
    <div class="field"><label for="nq_n">Nama toko</label><input id="nq_n" type="text" placeholder="Contoh: Kedai Kopi Tuku Senja"></div>
    <div class="field"><label for="nq_u">Nomor kios</label><input id="nq_u" type="text" placeholder="Contoh: L3-03"></div>
    <label style="display:block;font-size:11px;font-family:var(--mono);letter-spacing:.07em;margin-bottom:6px;color:#4A3B08">PILIH SATU BUKTI</label>
    <div class="proof"><button data-p="struk" class="on">📄 Foto struk<br><small>Kalau tokonya memberi struk</small></button>
    <button data-p="papan">🪧 Foto papan nama<br><small>Kalau tidak ada struk</small></button></div>
    <button class="btn" id="sendNoqr">Klaim hadiah ${rp(C.hadiahLaporan)}</button>
    <p class="privacy">Foto dan nomor kios dipakai hanya untuk memverifikasi kupon dan melengkapi direktori. Lokasi persis Anda tidak direkam.</p>
  </div>`;
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));
    document.getElementById('tabScan').style.display=b.dataset.t==='scan'?'':'none';
    document.getElementById('tabNoqr').style.display=b.dataset.t==='noqr'?'':'none'});
  document.querySelectorAll('.proof button').forEach(b=>b.onclick=()=>
    document.querySelectorAll('.proof button').forEach(x=>x.classList.toggle('on',x===b)));
  function pakaiKuota(){const c=cfg();if(c.kuponTerpakai>=c.kuponKuotaHari){toast('Kuota kupon hari ini sudah habis. Coba lagi besok.');return false}
    setCfg({kuponTerpakai:c.kuponTerpakai+1});
    const s=Math.max(0,c.kuponKuotaHari-c.kuponTerpakai-1);
    document.getElementById('quota').textContent=`KUOTA HARI INI: ${s} DARI ${c.kuponKuotaHari} · MAKS ${c.kuponPerNomor} PER NOMOR PER HARI`;
    return true}
  let si=0;
  document.getElementById('doScan').onclick=()=>{
    const list=units().filter(u=>isLive(u)&&u.qr==='aktif');
    if(!list.length){toast('Belum ada QR toko yang aktif di lantai ini.');return}
    const u=list[si++%list.length];if(!pakaiKuota())return;
    patchUnit(u.u,x=>x.scan++);
    document.getElementById('scanOut').innerHTML=`<div class="scanres"><b>QR TERBACA</b>
      <strong>${u.u} · ${esc(u.n)}</strong><br>Kupon ${rp(C.kuponNilai)} sudah masuk ke nomor WhatsApp Anda.</div>`;
    toast('Kupon masuk. Toko ditentukan oleh QR-nya, bukan dipilih pembeli.')};
  document.getElementById('sendNoqr').onclick=()=>{
    const n=document.getElementById('nq_n').value.trim(),ux=document.getElementById('nq_u').value.trim();
    if(!n||!ux){toast('Isi nama toko dan nomor kiosnya dulu, ya.');return}
    if(!pakaiKuota())return;
    addReport({nama:n,unit:ux.toUpperCase(),bukti:document.querySelector('.proof button.on').dataset.p});
    toast('Terima kasih. Hadiah dikirim setelah petugas kami verifikasi tokonya.');
    document.getElementById('nq_n').value='';document.getElementById('nq_u').value=''};
}
showDetail('L3-13');renderList('');
</script>
</body>
</html>
